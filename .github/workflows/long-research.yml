name: Manual comprehensive research Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprehensive-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build private evidence-cache key
        id: evidence-cache-key
        run: echo "key=market-evidence-v1-${{ runner.os }}-$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
      - name: Restore private market-evidence cache
        id: restore-market-evidence
        uses: actions/cache/restore@v4
        with:
          path: .private-data-cache/market-evidence-v1
          key: ${{ steps.evidence-cache-key.outputs.key }}
          restore-keys: |
            market-evidence-v1-${{ runner.os }}-
      - name: Fetch attributable market-news headlines
        run: python market_news.py
      - name: Build non-persistent candidate preview
        run: REPORT_MODE=comprehensive REPORT_PHASE=preview REPORT_OUTPUT=data/candidate-preview.txt CANDIDATE_MANIFEST=data/candidate-manifest.json python daily_report.py
      - name: Verify candidate-pool corporate actions
        run: python finmind_actions.py --candidate-manifest data/candidate-manifest.json --output backtest_data/candidate_actions.json
      - name: Build one verified comprehensive research snapshot
        run: REPORT_MODE=comprehensive REPORT_PHASE=final REPORT_OUTPUT=comprehensive-research.txt CANDIDATE_MANIFEST=data/candidate-manifest.json python daily_report.py
      - name: Save private market-evidence cache
        if: steps.restore-market-evidence.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .private-data-cache/market-evidence-v1
          key: ${{ steps.evidence-cache-key.outputs.key }}
      - name: Install AI agent
        run: python -m pip install "openai-agents>=0.6.0" python-dotenv
      - name: Restore private content-addressed AI cache
        uses: actions/cache/restore@v4
        with:
          path: .private-data-cache/ai-review-v1
          key: ai-review-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ai-review-v1-${{ runner.os }}-
      - name: Review comprehensive candidates with AI
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python investment_agent/cloud_report.py --mode comprehensive --manifest data/candidate-manifest.json --output ai-comprehensive-research.txt --limit 3
      - name: Check whether a verified AI cache entry was created
        id: ai-cache-status
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try:
              payload = json.load(open("data/ai-usage-status.json", encoding="utf-8"))
          except (OSError, ValueError):
              payload = {}
          print("save=" + ("true" if payload.get("cacheStatus") == "stored" else "false"))
          PY
      - name: Save newly verified AI cache entry
        if: steps.ai-cache-status.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: .private-data-cache/ai-review-v1
          key: ai-review-v1-${{ runner.os }}-${{ github.run_id }}
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-investment-report
          path: |
            comprehensive-research.txt
            ai-comprehensive-research.txt
            backtest_data/candidate_actions.json
            market-news.json
            data/candidate-manifest.json
            data/ai-usage-status.json
      - name: Push to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          for path in ("comprehensive-research.txt", "ai-comprehensive-research.txt"):
              text = open(path, encoding="utf-8").read().strip()
              for start in range(0, len(text), 3900):
                  body = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text[start:start + 3900]}).encode()
                  with urllib.request.urlopen(urllib.request.Request(url, data=body), timeout=30) as response:
                      result = json.load(response)
                  if not result.get("ok"):
                      raise RuntimeError(result)
          PY
