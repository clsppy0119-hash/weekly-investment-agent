name: Long-term research Telegram
on:
  workflow_dispatch:
  schedule:
    # 08:15 台北時間；僅在長線研究門檻達標時才會推播。
    - cron: "15 0 * * 1-5"
permissions:
  contents: read
jobs:
  long-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build long-term research
        run: REPORT_MODE=long LONG_AUTO=1 REPORT_OUTPUT=long-research.txt python daily_report.py
      - name: Check research threshold
        id: threshold
        run: |
          if [ -s long-research.txt ]; then echo "send=true" >> "$GITHUB_OUTPUT"; else echo "send=false" >> "$GITHUB_OUTPUT"; fi
      - name: Push research to Telegram
        if: steps.threshold.outputs.send == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          text = open("long-research.txt", encoding="utf-8").read()
          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          body = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text}).encode()
          with urllib.request.urlopen(urllib.request.Request(url, data=body), timeout=30) as response:
              result = json.load(response)
          if not result.get("ok"): raise RuntimeError(result)
          PY
