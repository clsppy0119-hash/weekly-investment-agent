name: Long-term research Telegram
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  long-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build long-term research
        run: REPORT_MODE=long REPORT_OUTPUT=long-research.txt python daily_report.py
      - name: Push research to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          text = open("long-research.txt", encoding="utf-8").read()
          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          body = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text}).encode()
          with urllib.request.urlopen(urllib.request.Request(url, data=body), timeout=30) as response:
              result = json.load(response)
          if not result.get("ok"): raise RuntimeError(result)
          PY
