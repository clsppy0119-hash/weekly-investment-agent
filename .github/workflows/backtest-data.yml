name: Cache total-return backtest data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      codes:
        description: "Optional sample or fixed basket codes, comma-separated"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: backtest-data-cache
  cancel-in-progress: false

jobs:
  cache-backtest-data:
    runs-on: ubuntu-latest
    env:
      DATA_CACHE_DIR: .private-data-cache
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      FIXED_UNIVERSE_CODES: ${{ inputs.codes || vars.FIXED_UNIVERSE_CODES }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore private historical cache
        uses: actions/cache/restore@v4
        with:
          path: .private-data-cache
          key: historical-fundamentals-v1-${{ runner.os }}-unavailable
          restore-keys: historical-fundamentals-v1-${{ runner.os }}-
      - name: Restore and save private backtest cache
        uses: actions/cache@v4
        with:
          path: .private-data-cache
          key: backtest-data-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: backtest-data-v2-${{ runner.os }}-
      - name: Restore official point-in-time snapshots
        uses: actions/cache/restore@v4
        with:
          path: .private-data-cache/point-in-time-snapshots-v1
          key: market-membership-v1-${{ runner.os }}-latest
          restore-keys: market-membership-v1-${{ runner.os }}-
      - name: Merge durable Supabase rows into private cache
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: python supabase_data_restore.py --output-dir .private-data-cache/finmind-backtest-v2/stocks
      - name: Cache historical semiconductor membership
        run: python historical_semiconductor_universe.py
      - name: Refresh all-market universe queue
        run: python all_market_universe.py
      - name: Cache official listing history
        run: python official_listing_history.py
      - name: Verify point-in-time universe evidence
        run: python point_in_time_universe.py
      - name: Refresh rebalance-date membership priority
        run: python market_membership_snapshots.py
      - name: Cache next total-return batch
        run: python backtest_data_cache.py --batch-size 35
      - name: Refresh point-in-time coverage after batch
        run: python market_membership_snapshots.py
      - name: Inspect private input schema safely
        run: python backtest_schema_probe.py
      - name: Persist historical rows to Supabase
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: python supabase_data_sync.py --cache-dir .private-data-cache
      - name: Upload non-sensitive cache status
        uses: actions/upload-artifact@v4
        with:
          name: backtest-data-status
          path: |
            data/backtest-data-cache-status.json
            data/backtest-schema-status.json
            data/historical-universe-status.json
            data/official-listing-history-status.json
            data/point-in-time-universe-status.json
            data/market-membership-snapshot-status.json
          if-no-files-found: error
