name: Daily report and Telegram
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron 使用 UTC；00:00 UTC = 台北時間 08:00。
    - cron: "0 0 * * 1-5"
permissions:
  contents: read
jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build daily report
        run: python daily_report.py
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-investment-report
          path: daily-report.txt
      - name: Push to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          with open("daily-report.txt", encoding="utf-8") as source:
              text = source.read()
          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          body = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text}).encode()
          request = urllib.request.Request(url, data=body)
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          if not result.get("ok"):
              raise RuntimeError(result)
          PY
