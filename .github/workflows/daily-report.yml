name: Daily report and Telegram

on:
  workflow_dispatch:
  schedule:
    # 00:00 UTC = 台北時間平日 08:00
    - cron: "0 0 * * 1-5"

permissions:
  contents: read

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build daily report
        run: REPORT_MODE=comprehensive python daily_report.py
      - name: Verify candidate-pool corporate actions
        run: python finmind_actions.py --output backtest_data/candidate_actions.json
      - name: Install AI agent
        run: python -m pip install "openai-agents>=0.6.0" python-dotenv
      - name: Review comprehensive candidates with AI
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python investment_agent/cloud_report.py --mode comprehensive --report daily-report.txt --output ai-daily-report.txt --limit 3
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-investment-report
          path: |
            daily-report.txt
            ai-daily-report.txt
            backtest_data/candidate_actions.json
      - name: Push to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          for path in ("daily-report.txt", "ai-daily-report.txt"):
              if not os.path.exists(path):
                  continue
              text = open(path, encoding="utf-8").read().strip()
              for start in range(0, len(text), 3900):
                  body = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text[start:start + 3900]}).encode()
                  request = urllib.request.Request(url, data=body)
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.load(response)
                  if not result.get("ok"):
                      raise RuntimeError(result)
          PY
