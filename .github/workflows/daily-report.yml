name: Daily report and Telegram

on:
  workflow_dispatch:
    inputs:
      record:
        description: >-
          記錄推薦到追蹤紀錄。手動執行預設關閉：在非交易日試跑會寫入一筆
          市場沒有開盤的決策日，污染前瞻紀錄。要正式補跑才開啟。
        type: boolean
        default: false
  schedule:
    # 00:00 UTC = 台北時間平日 08:00
    - cron: "0 0 * * 1-5"

permissions:
  contents: write

concurrency:
  group: prospective-daily-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A provider outage or an exhausted quota used to abort the job at this
      # first step, so the parts that need no provider at all -- prices, volume,
      # news, and healing the recommendation trails -- were lost with it. The
      # status file records the failure and the report states it; the evidence
      # contract already refuses candidates whose fundamentals are unlabelled,
      # so degrading here cannot produce a recommendation it should not.
      - name: Verify licensed FinMind data access
        continue-on-error: true
        run: python data_access.py --provider finmind
      - name: Build private evidence-cache key
        id: evidence-cache-key
        run: echo "key=market-evidence-v1-${{ runner.os }}-$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"
      - name: Restore private market-evidence cache
        id: restore-market-evidence
        uses: actions/cache/restore@v4
        with:
          path: .private-data-cache/market-evidence-v1
          key: ${{ steps.evidence-cache-key.outputs.key }}
          restore-keys: |
            market-evidence-v1-${{ runner.os }}-
      - name: Fetch attributable market-news headlines
        run: python market_news.py
      - name: Build non-persistent candidate preview
        run: REPORT_MODE=comprehensive REPORT_PHASE=preview REPORT_OUTPUT=data/candidate-preview.txt CANDIDATE_MANIFEST=data/candidate-manifest.json python daily_report.py
      - name: Enrich semiconductor fundamentals
        continue-on-error: true
        run: python finmind_fundamentals.py --candidate-manifest data/candidate-manifest.json
      - name: Verify candidate-pool corporate actions
        continue-on-error: true
        run: python finmind_actions.py --candidate-manifest data/candidate-manifest.json --output backtest_data/candidate_actions.json
      # quotes.json only carries a few days, so a run that fails for longer than
      # that leaves a permanent hole in every open recommendation's trail.
      # Official closes can refill it; missing cache is not a reason to fail.
      - name: Restore official TWSE dataset cache
        uses: actions/cache/restore@v4
        with:
          path: backtest_data
          key: official-twse-history-v1-${{ runner.os }}-unavailable
          restore-keys: official-twse-history-v1-${{ runner.os }}-
      - name: Heal gaps in recommendation price trails
        continue-on-error: true
        run: python backfill_trails.py
      # The listing and delisting evidence is refreshed every half hour by the
      # backtest-data workflow, but its certification was never written where
      # this report could see it, so every candidate failed the contract on
      # pit_not_certified. Recomputing it here is pure work over the restored
      # cache -- point_in_time_universe.py performs no network calls.
      - name: Restore private historical cache
        uses: actions/cache/restore@v4
        with:
          path: .private-data-cache
          key: backtest-data-v2-${{ runner.os }}-unavailable
          restore-keys: |
            backtest-data-v2-${{ runner.os }}-
            historical-fundamentals-v1-${{ runner.os }}-
      - name: Certify the point-in-time universe
        continue-on-error: true
        run: python point_in_time_universe.py --candidate-manifest data/candidate-manifest.json
      # A scheduled run always records. A manual run only does so on request,
      # so trying the pipeline on a non-trading day cannot enter a decision
      # dated to a session that never happened.
      - name: Build one verified report and decision snapshot
        env:
          REPORT_PHASE: ${{ (github.event_name == 'schedule' || inputs.record) && 'final' || 'preview' }}
        run: REPORT_MODE=comprehensive CANDIDATE_MANIFEST=data/candidate-manifest.json python daily_report.py
      - name: Save private market-evidence cache
        if: steps.restore-market-evidence.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .private-data-cache/market-evidence-v1
          key: ${{ steps.evidence-cache-key.outputs.key }}
      - name: Check deterministic manifest eligibility
        id: ai-eligibility
        run: python investment_agent/cloud_report.py --mode comprehensive --manifest data/candidate-manifest.json --eligibility-only >> "$GITHUB_OUTPUT"
      - name: Install AI agent only for eligible candidates
        if: steps.ai-eligibility.outputs.needs_ai == 'true'
        run: python -m pip install "openai-agents>=0.6.0" python-dotenv
      - name: Restore private content-addressed AI cache
        if: steps.ai-eligibility.outputs.needs_ai == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .private-data-cache/ai-review-v1
          key: ai-review-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ai-review-v1-${{ runner.os }}-
      - name: Review comprehensive candidates with AI
        if: steps.ai-eligibility.outputs.needs_ai == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python investment_agent/cloud_report.py --mode comprehensive --manifest data/candidate-manifest.json --output ai-daily-report.txt --limit 3
      - name: Check whether a verified AI cache entry was created
        id: ai-cache-status
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try:
              payload = json.load(open("data/ai-usage-status.json", encoding="utf-8"))
          except (OSError, ValueError):
              payload = {}
          print("save=" + ("true" if payload.get("cacheStatus") == "stored" else "false"))
          PY
      - name: Save newly verified AI cache entry
        if: steps.ai-cache-status.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: .private-data-cache/ai-review-v1
          key: ai-review-v1-${{ runner.os }}-${{ github.run_id }}
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-investment-report
          path: |
            daily-report.txt
            ai-daily-report.txt
            backtest_data/candidate_actions.json
            market-news.json
            data/fundamentals-coverage.json
            data/fundamentals-progress.json
            data/data-access-status.json
            data/candidate-manifest.json
            data/evidence-contract.json
            data/ai-usage-status.json
            strategy_data/recommendations.json
      - name: Persist verified financial data
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json data/fundamentals-coverage.json data/fundamentals-progress.json data/data-access-status.json strategy_data/recommendations.json
          git diff --cached --quiet || git commit -m "更新半導體財務資料"
          git push
      - name: Push to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          for path in ("daily-report.txt", "ai-daily-report.txt"):
              if not os.path.exists(path):
                  continue
              text = open(path, encoding="utf-8").read().strip()
              for start in range(0, len(text), 3900):
                  body = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text[start:start + 3900]}).encode()
                  request = urllib.request.Request(url, data=body)
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.load(response)
                  if not result.get("ok"):
                      raise RuntimeError(result)
          PY
      - name: Build isolated paper-cohort action universe
        id: paper_universe
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        continue-on-error: true
        run: >-
          python paper_trading.py action-universe
          --manifest data/candidate-manifest.json
          --ledger paper_data/comprehensive-v1.json
          --output data/paper-action-universe.json
      - name: Refresh actions for open paper cohorts
        id: paper_actions
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.paper_universe.outcome == 'success' }}
        continue-on-error: true
        run: >-
          python finmind_actions.py
          --candidate-manifest data/paper-action-universe.json
          --as-of-quotes quotes.json
          --output data/paper-actions.json
      - name: Advance prospective paper-only ledger
        id: paper_advance
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.paper_universe.outcome == 'success' && steps.paper_actions.outcome == 'success' }}
        continue-on-error: true
        run: >-
          python paper_trading.py advance
          --manifest data/candidate-manifest.json
          --quotes quotes.json
          --actions data/paper-actions.json
          --ledger paper_data/comprehensive-v1.json
          --progress data/prospective-paper-progress.json
      - name: Render tracked model advice
        id: model_advice
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.paper_advance.outcome == 'success' }}
        continue-on-error: true
        run: >-
          python model_advice.py
          --ledger paper_data/comprehensive-v1.json
          --output model-advice.txt
      - name: Require and persist prospective paper ledger
        id: paper_persist
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          PAPER_UNIVERSE_OUTCOME: ${{ steps.paper_universe.outcome }}
          PAPER_ACTIONS_OUTCOME: ${{ steps.paper_actions.outcome }}
          PAPER_ADVANCE_OUTCOME: ${{ steps.paper_advance.outcome }}
        run: |
          test "$PAPER_UNIVERSE_OUTCOME" = success
          test "$PAPER_ACTIONS_OUTCOME" = success
          test "$PAPER_ADVANCE_OUTCOME" = success
          test -s paper_data/comprehensive-v1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- paper_data/comprehensive-v1.json
          git diff --cached --quiet -- paper_data/comprehensive-v1.json || git commit -m "Append prospective paper observation" -- paper_data/comprehensive-v1.json
          git fetch origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          git rebase --autostash "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Upload prospective paper artifact
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.paper_persist.outcome == 'success' && steps.model_advice.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: prospective-paper-observation
          if-no-files-found: error
          path: |
            paper_data/comprehensive-v1.json
            data/prospective-paper-progress.json
            data/paper-actions.json
            model-advice.txt
      - name: Push persisted model advice to Telegram
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          PAPER_PERSIST_OUTCOME: ${{ steps.paper_persist.outcome }}
          MODEL_ADVICE_OUTCOME: ${{ steps.model_advice.outcome }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test "$PAPER_PERSIST_OUTCOME" = success
          test "$MODEL_ADVICE_OUTCOME" = success
          test -s model-advice.txt
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          text = open("model-advice.txt", encoding="utf-8").read().strip()
          for start in range(0, len(text), 3900):
              body = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text[start:start + 3900]}).encode()
              request = urllib.request.Request(url, data=body)
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  raise RuntimeError(result)
          PY
