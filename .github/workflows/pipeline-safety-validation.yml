name: Pipeline safety validation

on:
  pull_request:
    paths:
      - "candidate_manifest.py"
      - "daily_report.py"
      - "data_contract.py"
      - "scoring.py"
      - "finmind_actions.py"
      - "finmind_fundamentals.py"
      - "strategy_tracker.py"
      - "investment_agent/cloud_report.py"
      - "investment_agent/research_team.py"
      - "pit_availability_evidence.py"
      - "official_availability_capability.py"
      - "official_metadata_smoke.py"
      - "official_announcement_availability.py"
      - "official_announcement_first_seen.py"
      - "announcement_first_seen_db_contract.py"
      - "announcement_first_seen_staging_contract.py"
      - "staging_authority_package.py"
      - "decision_outcome_event_contract.py"
      - "decision_outcome_manifest.py"
      - "decision_outcome_sandbox.py"
      - "decision_outcome_db_contract.py"
      - "decision_outcome_staging_dry_run.py"
      - "decision_outcome_membership_probe.py"
      - "decision_outcome_revoke_semantics_probe.py"
      - "execution_accounting.py"
      - "backtest.py"
      - "total_return_backtest.py"
      - "walk_forward.py"
      - "weekly_walk_forward.py"
      - "market_membership_snapshots.py"
      - "freeze_lineage_summary.py"
      - "lineage_replay.py"
      - "point_in_time_fundamentals.py"
      - "strategy_backtest.py"
      - "actual_comprehensive_selection.py"
      - "actual_comprehensive_selection_parity.py"
      - "actual_comprehensive_outcome_accounting.py"
      - "investment_advice_gate.py"
      - "production_strategy_validation_preflight.py"
      - "authoritative_pit_coverage_certification.py"
      - "trusted_pit_bundle_registry_v1.json"
      - "official_full_market_population.py"
      - "market_population_contract.py"
      - "official_population_artifact_receipt.py"
      - "official_population_source_admission.py"
      - "official_population_source_admission_registry_v1.json"
      - "forward_population_observation.py"
      - "forward_population_ledger_store.py"
      - "forward_population_observation_ledger_v1.json"
      - "decision_outcome_export.py"
      - "staging_preflight_result.py"
      - "supabase-decision-outcome-shadow-v1.sql"
      - "supabase-announcement-first-seen-shadow-v1.sql"
      - "supabase-announcement-first-seen-validate-v1.sql"
      - "supabase-announcement-first-seen-staging-preflight-v1.sql"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  local-equivalent-safety-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shared restore action without downloading data
        uses: ./.github/actions/restore-backtest-inputs
        with:
          lookup-only: "true"
      - name: Compile changed Python modules
        run: >-
          python -m py_compile candidate_manifest.py daily_report.py data_contract.py scoring.py strategy_tracker.py
          finmind_fundamentals.py finmind_actions.py investment_agent/cloud_report.py
          investment_agent/research_team.py pit_availability_evidence.py
          official_availability_capability.py
          official_metadata_smoke.py
          official_announcement_availability.py
          official_announcement_first_seen.py
          announcement_first_seen_db_contract.py
          announcement_first_seen_staging_contract.py
          staging_authority_package.py
          decision_outcome_event_contract.py
          decision_outcome_manifest.py
          decision_outcome_sandbox.py
          decision_outcome_db_contract.py
          decision_outcome_staging_dry_run.py
          decision_outcome_membership_probe.py
          decision_outcome_revoke_semantics_probe.py
          execution_accounting.py backtest.py total_return_backtest.py
          walk_forward.py weekly_walk_forward.py market_membership_snapshots.py
          freeze_lineage_summary.py lineage_replay.py point_in_time_fundamentals.py
          strategy_backtest.py
          actual_comprehensive_selection.py
          actual_comprehensive_selection_parity.py
          actual_comprehensive_outcome_accounting.py
          investment_advice_gate.py
          production_strategy_validation_preflight.py
          authoritative_pit_coverage_certification.py
          official_full_market_population.py
          market_population_contract.py
          official_population_artifact_receipt.py
          official_population_source_admission.py
          forward_population_observation.py
          forward_population_ledger_store.py
          decision_outcome_export.py
          staging_preflight_result.py
      - name: Run deterministic safety tests
        run: python -m unittest discover -s tests -v
