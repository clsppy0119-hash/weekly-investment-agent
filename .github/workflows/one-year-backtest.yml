name: Rolling official TWSE backtest

on:
  schedule:
    # Monday 09:00 Asia/Taipei (01:00 UTC), after the prior week closes.
    - cron: "0 1 * * 1"
  workflow_dispatch:

concurrency:
  group: one-year-backtest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_CACHE_DIR: .private-data-cache
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore and save official TWSE dataset cache
        uses: actions/cache@v4
        with:
          path: backtest_data
          key: official-twse-history-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            official-twse-history-v1-${{ runner.os }}-
            one-year-twse-v1-${{ runner.os }}-
      - name: Restore shared verified backtest inputs
        uses: ./.github/actions/restore-backtest-inputs
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Restore and save official point-in-time snapshots
        uses: actions/cache@v4
        with:
          path: .private-data-cache/point-in-time-snapshots-v2
          key: market-membership-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-membership-v2-${{ runner.os }}-
      - name: Download two years of official TWSE data
        run: python backtest.py collect --days 730
      - name: Run train validation test backtest
        run: python backtest.py report --benchmark backtest_data/tai50_total_return.json
      - name: Run rolling out-of-sample validation
        run: python walk_forward.py --history backtest_data/twse_daily.jsonl --benchmark backtest_data/tai50_total_return.json --output backtest_data/walk-forward-status.json
      - name: Refresh point-in-time universe evidence
        run: |
          python all_market_universe.py
          python official_listing_history.py
          python point_in_time_universe.py
          python market_membership_snapshots.py
      - name: Run companion total-return backtest
        run: python total_return_backtest.py --output backtest_data/total-return-backtest-status.json
      - name: Audit stock-dividend adjustment mapping
        run: python corporate_action_audit.py
      - name: Evaluate investment-advice gate
        run: python investment_advice_gate.py --one-year backtest_data/one_year_backtest.json --total-return backtest_data/total-return-backtest-status.json --rolling backtest_data/walk-forward-status.json --output backtest_data/investment-advice-gate.json
      - name: Upload backtest result
        uses: actions/upload-artifact@v4
        with:
          name: one-year-twse-backtest
          path: |
            backtest_data/
            data/corporate-action-audit-status.json
            data/point-in-time-universe-status.json
            data/market-membership-snapshot-status.json
      - name: Push result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          text = open("backtest_data/one_year_backtest.md", encoding="utf-8").read()
          url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          body = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text[:3900]}).encode()
          with urllib.request.urlopen(urllib.request.Request(url, data=body), timeout=30) as response:
              result = json.load(response)
          if not result.get("ok"):
              raise RuntimeError(result)
          PY
