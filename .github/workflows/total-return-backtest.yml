name: Total-return backtest

on:
  schedule:
    # Every Monday at 09:30 Asia/Taipei (01:30 UTC).
    - cron: "30 1 * * 1"
  workflow_dispatch:
    inputs:
      codes:
        description: "Optional sample or fixed basket codes, comma-separated"
        required: false
        type: string

permissions:
  contents: read

jobs:
  total-return-backtest:
    runs-on: ubuntu-latest
    env:
      DATA_CACHE_DIR: .private-data-cache
      FIXED_UNIVERSE_CODES: ${{ inputs.codes || vars.FIXED_UNIVERSE_CODES }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore private historical cache
        uses: actions/cache/restore@v4
        with:
          path: .private-data-cache
          key: historical-fundamentals-v1-${{ runner.os }}-unavailable
          restore-keys: historical-fundamentals-v1-${{ runner.os }}-
      - name: Restore private total-return inputs
        uses: actions/cache/restore@v4
        with:
          path: .private-data-cache
          key: backtest-data-v2-${{ runner.os }}-latest
          restore-keys: backtest-data-v2-${{ runner.os }}-
      - name: Merge durable cache from Supabase
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: python supabase_data_restore.py --output-dir .private-data-cache/finmind-backtest-v2/stocks
      - name: Verify strict point-in-time universe evidence
        run: |
          python point_in_time_universe.py
          python market_membership_snapshots.py
      - name: Run auditable total-return backtest
        run: python total_return_backtest.py
      - name: Run explicit fixed-basket backtest
        run: python fixed_universe_backtest.py
      - name: Audit stock-dividend adjustment mapping
        run: python corporate_action_audit.py
      - name: Upload non-sensitive backtest result
        uses: actions/upload-artifact@v4
        with:
          name: total-return-backtest
          path: |
            data/total-return-backtest-status.json
            data/corporate-action-audit-status.json
            data/point-in-time-universe-status.json
            data/market-membership-snapshot-status.json
            data/fixed-universe-backtest-status.json
