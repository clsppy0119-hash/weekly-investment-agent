name: Refresh official Taiwan market data

on:
  schedule:
    # 17:30 Taipei time: after the market close and before the next report run.
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-official-data:
    runs-on: ubuntu-latest
    env:
      DATA_CACHE_DIR: .private-data-cache
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore private data cache
        uses: actions/cache@v4
        with:
          path: .private-data-cache
          key: official-data-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: official-data-v1-${{ runner.os }}-
      - name: Restore semiconductor universe metadata
        uses: actions/cache/restore@v4
        with:
          path: .private-data-cache/finmind-market-v1
          key: licensed-data-v1-${{ runner.os }}-unavailable
          restore-keys: licensed-data-v1-${{ runner.os }}-
      - name: Restore licensed historical-data cache
        uses: actions/cache/restore@v4
        with:
          path: .private-data-cache/finmind-fundamentals-v1
          key: licensed-data-v1-${{ runner.os }}-unavailable
          restore-keys: licensed-data-v1-${{ runner.os }}-
      - name: Refresh official market snapshot
        run: python official_market_cache.py
      - name: Refresh official fundamentals snapshot
        run: python official_fundamentals_cache.py
      - name: Incrementally cache disclosed MOPS statements
        # Requests remain capped at two concurrent connections in the script;
        # a larger batch shortens the number of daily refresh cycles needed to
        # cover the public semiconductor universe.
        run: python mops_fundamental_cache.py --batch-size 50
      - name: Incrementally cache authorised six-year fundamentals
        run: python finmind_fundamental_cache.py --batch-size 10
      - name: Normalise cached MOPS XBRL filings
        run: python mops_xbrl_normalize.py
      - name: Record auditable fundamental decision gate
        run: python fundamental_decision_gate.py
      - name: Upload non-sensitive status
        uses: actions/upload-artifact@v4
        with:
          name: official-data-status
          path: data/official-*-status.json
          if-no-files-found: error
